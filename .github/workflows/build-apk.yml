name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['etapa-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Preparar clave de firma (solo si existen los secrets)
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
            echo "JARVIS_KEYSTORE_PATH=$RUNNER_TEMP/jarvis.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave propia."
          else
            echo "Sin clave propia: se firmará con la clave de depuración (solo para pruebas)."
          fi

      - name: Definir nombre de versión
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "JARVIS_VERSION_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "JARVIS_VERSION_NAME=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "jarvis-${JARVIS_VERSION_NAME}.apk"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis-*.apk

      - name: Publicar Release (solo con etiqueta etapa-*)
        if: startsWith(github.ref, 'refs/tags/etapa-')
        uses: softprops/action-gh-release@v2
        with:
          files: jarvis-*.apk
